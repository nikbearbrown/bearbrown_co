name: Refresh audit entries

on:
  schedule:
    # Run nightly at 04:00 UTC — auditor runs ~100/hr so a day adds ~2,500 new records.
    - cron: '0 4 * * *'
  workflow_dispatch:      # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write         # Needed to commit audit-entries.json back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate audit entries
        env:
          GITHUB_READ_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}
        run: node scripts/ingest-to-file.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog/audit-entries.json
          # Exit cleanly if nothing changed (idempotent)
          git diff --cached --quiet && echo "No changes to audit-entries.json" && exit 0
          COUNT=$(python3 -c "import json; d=json.load(open('data/catalog/audit-entries.json')); print(len(d))")
          git commit -m "chore: refresh audit-entries.json ($COUNT entries)"
          git push
